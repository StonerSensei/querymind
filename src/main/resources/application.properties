spring.application.name=querymind

# Web server port (8080 may be used by other local apps).
server.port=${PORT:8085}

# ===== MCP server =====
# Streamable HTTP transport. Tools are exposed at POST /mcp
spring.ai.mcp.server.name=querymind
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.instructions=QueryMind lets you explore and query SQL databases in plain English.

# ===== QueryMind system database =====
# Override QUERYMIND_DB_URL in production to point at your managed Postgres.
spring.datasource.url=${QUERYMIND_DB_URL:jdbc:postgresql://localhost:5433/querymind}
spring.datasource.username=${QUERYMIND_DB_USER:querymind}
spring.datasource.password=${QUERYMIND_DB_PASSWORD:querymind}

# Hibernate creates/updates tables from the entity classes.
# Switch to validate (or use Flyway) before going to production.
spring.jpa.hibernate.ddl-auto=update

# ===== Credential encryption =====
# Master key used to encrypt stored DB passwords at rest.
# MUST be overridden in production via environment variable.
querymind.encryption.key=${QUERYMIND_ENCRYPTION_KEY:dev-secret-key-change-me}

# ===== JWT (login tokens) =====
# MUST be overridden in production via environment variable (min 32 chars).
querymind.jwt.secret=${QUERYMIND_JWT_SECRET:dev-jwt-secret-change-me-0123456789-abcdef}
querymind.jwt.expiration-ms=86400000

# ===== Anthropic (optional) =====
# Set ANTHROPIC_API_KEY to enable plain-English explain_query summaries.
# Without it, explain_query still returns the raw query plan.
querymind.anthropic.api-key=${ANTHROPIC_API_KEY:}
querymind.anthropic.model=claude-sonnet-4-5