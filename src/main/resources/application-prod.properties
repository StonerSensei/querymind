# ===== Production profile =====
# Activate with: -Dspring.profiles.active=prod
# Or set the environment variable: SPRING_PROFILES_ACTIVE=prod
#
# All secrets MUST be supplied as environment variables — the defaults in
# application.properties are for development only and must not be used here.
#
# Required environment variables:
#   QUERYMIND_DB_URL          e.g. jdbc:postgresql://db.example.com:5432/querymind
#   QUERYMIND_DB_USER         database username
#   QUERYMIND_DB_PASSWORD     database password
#   QUERYMIND_ENCRYPTION_KEY  random string >= 32 chars, used to encrypt stored DB passwords
#   QUERYMIND_JWT_SECRET      random string >= 32 chars, used to sign login tokens
#
# Optional:
#   ANTHROPIC_API_KEY         enables plain-English explain_query summaries
#   PORT                      overrides server.port if your host sets it

# Clean logs — no SQL, no debug noise.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=WARN
logging.level.dev.querymind=INFO

# Do not seed the demo user and demo connections in production.
querymind.seed.enabled=false

# Stricter actuator exposure — health only, no env or beans endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never