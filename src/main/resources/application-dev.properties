# ===== Development profile =====
# Activated automatically when running locally (./mvnw spring-boot:run).
# To activate explicitly: -Dspring.profiles.active=dev
#
# Do NOT use these settings in production.

# Print every SQL statement Hibernate runs, formatted for readability.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Verbose Spring Security logging — useful when debugging auth issues.
logging.level.org.springframework.security=DEBUG

# Show which MCP tools are registered at startup.
logging.level.org.springframework.ai.mcp=DEBUG